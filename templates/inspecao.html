<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspeção industrial</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="container card inspecao-card">
        <h1>Estação de inspeção visual</h1>
        <p>
            Olá, {{ usuario }}. Posicione um objeto escuro sobre um fundo claro
            dentro da região central e execute a inspeção.
        </p>
        
        <div class="video-industrial">
            <video id="video" autoplay playsinline></video>
            <div class="zona-inspecao"></div>
        </div>
        
        <canvas id="canvas" hidden></canvas>
        
        <p id="mensagem" class="mensagem">
            A câmera ainda não foi iniciada.
        </p>
        
        <div class="acoes">
            <button id="btnAbrir" type="button">Habilitar câmera</button>
            <button id="btnInspecionar" type="button" disabled>Inspecionar peça</button>
            <button id="btnFechar" type="button" class="secundario">Desligar câmera</button>
            <a class="botao secundario" href="{{ url_for('bem_vindo') }}">Voltar</a>
        </div>
    </main>

    <script>
        const video = document.getElementById("video");
        const canvas = document.getElementById("canvas");
        const mensagem = document.getElementById("mensagem");
        const btnAbrir = document.getElementById("btnAbrir");
        const btnInspecionar = document.getElementById("btnInspecionar");
        const btnFechar = document.getElementById("btnFechar");
        
        let stream = null;

        async function habilitarCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: false
                });
                video.srcObject = stream;
                btnInspecionar.disabled = false;
                mensagem.textContent = "Câmera habilitada. Posicione a peça.";
            } catch (erro) {
                mensagem.textContent = "Não foi possível acessar a câmera. Verifique a permissão.";
                console.error(erro);
            }
        }

        function desligarCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;
                stream = null;
            }
            btnInspecionar.disabled = true;
            mensagem.textContent = "Câmera desligada.";
        }

        async function inspecionarPeca() {
            if (!stream || video.videoWidth === 0) {
                mensagem.textContent = "Habilite a câmera primeiro.";
                return;
            }

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const contexto = canvas.getContext("2d");
            contexto.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            mensagem.textContent = "Inspeção em processamento...";
            btnInspecionar.disabled = true;

            canvas.toBlob(async function (blob) {
                const formulario = new FormData();
                formulario.append("frame", blob, "inspecao.png");

                try {
                    const resposta = await fetch("{{ url_for('inspecao.analisar_frame') }}", {
                        method: "POST",
                        body: formulario
                    });

                    const dados = await resposta.json();
                    
                    if (!resposta.ok) {
                        mensagem.textContent = dados.erro;
                        btnInspecionar.disabled = false;
                        return;
                    }

                    window.location.href = dados.url;
                } catch (erro) {
                    mensagem.textContent = "Erro ao enviar a imagem para o servidor.";
                    btnInspecionar.disabled = false;
                    console.error(erro);
                }
            }, "image/png");
        }

        btnAbrir.addEventListener("click", habilitarCamera);
        btnInspecionar.addEventListener("click", inspecionarPeca);
        btnFechar.addEventListener("click", desligarCamera);
    </script>
</body>
</html>
